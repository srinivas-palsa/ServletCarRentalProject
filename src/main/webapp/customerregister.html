<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveEasy | Customer Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.82)
                ),
                url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;
        }


        /* ================= NAVBAR ================= */

        header {
            background: rgba(255, 255, 255, 0.97);
        }

        .navbar {
            max-width: 1200px;
            height: 75px;

            margin: auto;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #111;
        }

        .logo span {
            color: #e63946;
        }

        .home-btn {
            padding: 10px 20px;

            border: 1px solid #ddd;
            border-radius: 6px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            color: #333;

            transition: 0.3s;
        }

        .home-btn:hover {
            background: #e63946;
            color: white;
            border-color: #e63946;
        }


        /* ================= MAIN ================= */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }


        /* ================= REGISTER CARD ================= */

        .register-card {
            width: 100%;
            max-width: 650px;

            padding: 45px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .register-card h1 {
            text-align: center;

            font-size: 32px;

            color: #111;

            margin-bottom: 8px;
        }

        .register-card h1 span {
            color: #e63946;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        .register-form {
            width: 100%;
        }

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 20px;
        }

        .form-group {
            width: 100%;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 14px;

            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #e63946;

            box-shadow:
                0 0 0 2px rgba(230, 57, 70, 0.1);
        }


        /* ================= BUTTONS ================= */

        .button-group {
            display: flex;

            gap: 15px;

            margin-top: 10px;
        }

        .button {
            flex: 1;

            padding: 13px;

            border-radius: 6px;

            font-size: 14px;

            font-weight: 700;

            text-align: center;

            cursor: pointer;

            text-decoration: none;

            transition: 0.3s;
        }

        .register-btn {
            border: none;

            background: #111;

            color: white;
        }

        .register-btn:hover {
            background: #e63946;
        }

        .cancel-btn {
            border: 1px solid #ddd;

            background: white;

            color: #333;
        }

        .cancel-btn:hover {
            background: #e63946;

            color: white;

            border-color: #e63946;
        }


        /* ================= LOGIN LINK ================= */

        .login-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 13px;

            text-decoration: none;
        }

        .login-link:hover {
            color: #e63946;
        }


        /* ================= FOOTER ================= */

        footer {
            padding: 18px;

            text-align: center;

            color: #aaa;

            font-size: 12px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 650px) {

            .register-card {
                padding: 35px 25px;
            }

            .form-row {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .button-group {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Drive<span>Easy</span>
            </div>

            <a href="customerlogin.html" class="home-btn">
                Back to Login
            </a>

        </nav>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <div class="register-card">


            <h1>
                Create <span>Account</span>
            </h1>

            <p class="subtitle">
                Register with DriveEasy to start renting cars
            </p>


            <!-- ================= FORM ================= -->

            <form
                class="register-form"
                action="registercustomer"
                method="post">


                <!-- ================= ROW 1 ================= -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter your mobile number"
                            required
                        >

                    </div>

                </div>


                <!-- ================= ROW 2 ================= -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>

                </div>


                <!-- ================= BUTTONS ================= -->

                <div class="button-group">

                    <a
                        href="customerlogin.html"
                        class="button cancel-btn">
                        CANCEL
                    </a>

                    <button
                        type="submit"
                        class="button register-btn">
                        REGISTER
                    </button>

                </div>


            </form>


            <!-- ================= LOGIN ================= -->

            <a
                href="customerlogin.html"
                class="login-link">
                Already have an account? Login here
            </a>


        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 DriveEasy. All Rights Reserved.

    </footer>


</body>

</html>
